# Heartbox — Helix (~/.config/helix/themes/heartbox.toml)
"ui.background" = { bg = "background" }
"ui.text" = "foreground"
"ui.cursor" = { fg = "background", bg = "silver" }
"ui.selection" = { bg = "selection" }
"ui.linenr" = "bright_black"
"ui.linenr.selected" = "silver"
"ui.statusline" = { fg = "foreground", bg = "current_line" }
"ui.statusline.inactive" = { fg = "comment", bg = "current_line" }
"ui.menu" = { fg = "foreground", bg = "current_line" }
"ui.menu.selected" = { fg = "background", bg = "red" }
"comment" = { fg = "comment", modifiers = ["italic"] }
"keyword" = "pink"
"function" = "sky"
"string" = "yellow"
"constant" = "purple"
"type" = "sky"
"variable" = "foreground"
"number" = "orange"
"punctuation" = "silver"
"operator" = "pink"
"error" = "red"
"warning" = "orange"
"info" = "sky"
"hint" = "silver"
"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "yellow"

[palette]
background = "#0A1528"
current_line = "#142238"
selection = "#4E1A22"
foreground = "#EDE6DE"
comment = "#6E7A8A"
sky = "#1E8AE8"
green = "#3D9650"
orange = "#E06028"
pink = "#D47A82"
purple = "#5A4E9E"
red = "#E03818"
yellow = "#D4A838"
silver = "#B8C0C8"
bright_black = "#2A3548"
