# Heartbox — Helix (~/.config/helix/themes/heartbox.toml)
"ui.background" = { bg = "background" }
"ui.text" = "foreground"
"ui.cursor" = { fg = "background", bg = "silver" }
"ui.selection" = { bg = "selection" }
"ui.linenr" = "bright_black"
"ui.linenr.selected" = "silver"
"ui.statusline" = { fg = "foreground", bg = "current_line" }
"ui.statusline.inactive" = { fg = "comment", bg = "current_line" }
"ui.menu" = { fg = "foreground", bg = "current_line" }
"ui.menu.selected" = { fg = "background", bg = "red" }
"comment" = { fg = "comment", modifiers = ["italic"] }
"keyword" = "pink"
"function" = "sky"
"string" = "yellow"
"constant" = "purple"
"type" = "sky"
"variable" = "foreground"
"number" = "orange"
"punctuation" = "silver"
"operator" = "pink"
"error" = "red"
"warning" = "orange"
"info" = "sky"
"hint" = "silver"
"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "yellow"

[palette]
background = "#191413"
current_line = "#3D2F2D"
selection = "#4B1006"
foreground = "#E8E4DC"
comment = "#7A656A"
sky = "#0888ED"
green = "#5A8A42"
orange = "#EA5638"
pink = "#C97A86"
purple = "#6B4A58"
red = "#E5141A"
yellow = "#D4B84A"
silver = "#C2C8CC"
bright_black = "#3D2F2D"
