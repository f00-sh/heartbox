# Heartbox — Helix (~/.config/helix/themes/heartbox.toml)
"ui.background" = { bg = "background" }
"ui.text" = "foreground"
"ui.cursor" = { fg = "background", bg = "silver" }
"ui.selection" = { bg = "selection" }
"ui.linenr" = "bright_black"
"ui.linenr.selected" = "silver"
"ui.statusline" = { fg = "foreground", bg = "current_line" }
"ui.statusline.inactive" = { fg = "comment", bg = "current_line" }
"ui.menu" = { fg = "foreground", bg = "current_line" }
"ui.menu.selected" = { fg = "background", bg = "red" }
"comment" = { fg = "comment", modifiers = ["italic"] }
"keyword" = "pink"
"function" = "sky"
"string" = "yellow"
"constant" = "purple"
"type" = "sky"
"variable" = "foreground"
"number" = "orange"
"punctuation" = "silver"
"operator" = "pink"
"error" = "red"
"warning" = "orange"
"info" = "sky"
"hint" = "silver"
"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "yellow"

[palette]
background = "#090909"
current_line = "#1C1617"
selection = "#56180A"
foreground = "#EDE6DE"
comment = "#8A7874"
sky = "#1E78C8"
green = "#3D8A48"
orange = "#C45A20"
pink = "#C47A72"
purple = "#454B93"
red = "#D44A18"
yellow = "#C49A3C"
silver = "#B8BEC2"
bright_black = "#3A3232"
